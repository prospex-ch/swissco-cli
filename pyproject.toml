[project]
name = "swissco"
version = "0.3.0"
description = "Swiss company data from the shell: Zefix, SHAB, simap, FINMA, GLEIF and ARAMIS in one command"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Prospex", email = "hello@prospex.ch" },
]
requires-python = ">=3.14"
keywords = [
    "swiss", "zefix", "shab", "sogc", "commercial-register", "handelsregister",
    "cli", "lindas", "simap", "finma", "procurement", "public-tenders",
    "lei", "gleif", "aramis", "research", "innosuisse",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "zefix-parser[http]>=0.1",
    "shab-parser[http]>=0.2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swissco = "swissco.cli:main"

[project.urls]
Homepage = "https://prospex.ch"
Repository = "https://github.com/prospex-ch/swissco-cli"
Documentation = "https://swissco.readthedocs.io"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
